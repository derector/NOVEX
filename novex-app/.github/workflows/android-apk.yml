name: Build Android APK
on:
  push:
    branches: [main]
    paths:
      - 'novex-app/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: novex-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate and build web bundle
        run: |
          node --check src/main.js
          npm run build
      - name: Create Android project
        run: npx cap add android
      - name: Sync native plugins
        run: npx cap sync android
      - name: Build debug APK
        working-directory: novex-app/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVEX-Android-APK
          path: novex-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
