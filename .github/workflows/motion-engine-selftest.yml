name: Motion Engine Self-Test
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: motion-engine-selftest-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  engine-selftest:
    name: Extract and render-test motion-engine v3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/motion-director/node_modules
            ~/.cache/ms-playwright
          key: motion-engine-${{ runner.os }}-${{ hashFiles('scripts/setup-motion-engine-wsl.sh') }}
          restore-keys: |
            motion-engine-${{ runner.os }}-
      - name: Install dependencies and run self-test
        timeout-minutes: 15
        run: bash scripts/setup-motion-engine-wsl.sh
