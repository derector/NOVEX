name: NOVEX Build
on:
  push:
    branches: [main, 'feat/**', 'chore/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: novex-build-v2-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: write
  pages: write
  id-token: write
jobs:
  web:
    name: Build installable web app
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: novex-app
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Check JavaScript syntax
        run: node --check src/main.js && node --check src/audio-analysis.js && node --check src/timeline.js && node --check src/motion-engine.js && node --check src/motion-audio.js && node --check src/motion-director.js && node --check src/motion3d.js && node --check src/cloud.js && node --check scripts/sync-motion-skills.mjs && node --check scripts/sync-engine-references.mjs && node --check scripts/motion-agent.mjs && node --check scripts/browser-render-smoke.mjs
      - name: Test render pipeline contracts
        run: npm test
      - name: Build for GitHub Pages
        run: npm run build && test -s dist/ffmpeg/ffmpeg-core.js && test -s dist/ffmpeg/ffmpeg-core.wasm
        env:
          VITE_BASE_PATH: /NOVEX/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://jtkpydprgqccxxkqcvou.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_HbBlyHbGCY6SFmoo9qL1eg_p6jOYVEO' }}
      - name: Audit locked application dependency tree
        run: |
          npm audit --json > /tmp/novex-audit-locked.json || true
          node --input-type=commonjs -e 'const a=require("/tmp/novex-audit-locked.json"); console.log(JSON.stringify({scope:"locked application dependencies",summary:a.metadata?.vulnerabilities,findings:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,via:v.via.map(x=>typeof x==="string"?x:{name:x.name,title:x.title,url:x.url,range:x.range}),fixAvailable:v.fixAvailable}))},null,2))'
      - name: Install media tools and Chromium for browser render smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm install --no-save --package-lock=false playwright ffmpeg-static ffprobe-static
          npm audit --json > /tmp/novex-audit-smoke-tools.json || true
          node --input-type=commonjs -e 'const a=require("/tmp/novex-audit-smoke-tools.json"); console.log(JSON.stringify({scope:"application plus temporary smoke-test tools",summary:a.metadata?.vulnerabilities,findings:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,via:v.via.map(x=>typeof x==="string"?x:{name:x.name,title:x.title,url:x.url,range:x.range}),fixAvailable:v.fixAvailable}))},null,2))'
          npx playwright install --only-shell chromium
          node -e 'console.log(require("path").dirname(require("ffmpeg-static")))' >> "$GITHUB_PATH"
          node -e 'console.log(require("path").dirname(require("ffprobe-static").path))' >> "$GITHUB_PATH"
      - name: Verify FFmpeg for media fixtures
        run: ffmpeg -version
      - name: Generate tiny media fixtures for real MP4 export
        run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "color=c=0x553b86:s=320x180:r=30:d=3" -an -c:v libvpx -deadline realtime -cpu-used 8 -pix_fmt yuv420p /tmp/novex-smoke-reference.webm
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "color=c=0x246779:s=320x180:r=30:d=3" -an -c:v libvpx -deadline realtime -cpu-used 8 -pix_fmt yuv420p /tmp/novex-smoke-reference-2.webm
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "color=c=0x813d72:s=180x320:r=30:d=3" -an -c:v libvpx -deadline realtime -cpu-used 8 -pix_fmt yuv420p /tmp/novex-smoke-portrait.webm
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=3" -c:a pcm_s16le /tmp/novex-smoke-track.wav
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "color=c=0x77552d:s=320x180:r=30:d=3" -f lavfi -i "sine=frequency=660:sample_rate=48000:duration=3" -shortest -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -b:a 96k -movflags +faststart /tmp/novex-smoke-source.mp4
      - name: Prepare base-path preview tree
        run: mkdir -p /tmp/novex-preview/NOVEX && cp -a dist/. /tmp/novex-preview/NOVEX/
      - name: Run browser render smoke test
        run: node scripts/browser-render-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: NOVEX-Web-Build
          path: novex-app/dist/
          retention-days: 30
      - uses: actions/upload-pages-artifact@v3
        with:
          path: novex-app/dist/
  android:
    name: Build Android APK
    needs: web
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: novex-app
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: novex-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate source and render contracts
        run: |
          node --check src/main.js
          node --check src/motion-engine.js
          node --check src/motion-director.js
          node --check src/motion-audio.js
          node --check src/motion3d.js
          npm test
      - name: Build web assets for Android
        run: npm run build
      - name: Generate Capacitor Android project
        run: npx cap add android
      - name: Sync native plugins and web assets
        run: npx cap sync android
      - name: Assemble debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Install and launch APK in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          script: |
            APK="novex-app/android/app/build/outputs/apk/debug/app-debug.apk"
            test -s "$APK"
            APP_ID="studio.novex.motion"
            echo "Testing package: $APP_ID"
            adb install -r "$APK"
            adb shell monkey -p "$APP_ID" -c android.intent.category.LAUNCHER 1
            sleep 15
            adb shell pidof "$APP_ID"
            adb logcat -d -t 2500 > /tmp/novex-android-smoke-logcat.txt
            if grep -E "FATAL EXCEPTION|AndroidRuntime.*(FATAL|Process:)" /tmp/novex-android-smoke-logcat.txt; then
              echo "Fatal Android runtime error detected"
              exit 1
            fi
      - name: Verify APK exists and is non-empty
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NOVEX-Android-APK
          path: novex-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Publish Web site (GitHub Pages)
    if: github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    concurrency:
      group: novex-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
