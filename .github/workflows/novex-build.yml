name: NOVEX Build
on:
  push:
    branches: [main, 'qa/**']
  workflow_dispatch:
concurrency:
  group: novex-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: write
  pages: write
  id-token: write
jobs:
  web:
    name: Build installable web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: novex-app
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: node --check src/main.js && node --check src/motion3d.js && node --check src/cloud.js && node --check scripts/browser-render-smoke.mjs
      - name: Test render pipeline contracts
        run: npm test
      - name: Build for GitHub Pages
        run: npm run build && test -s dist/ffmpeg/ffmpeg-core.js && test -s dist/ffmpeg/ffmpeg-core.wasm
        env:
          VITE_BASE_PATH: /NOVEX/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://jtkpydprgqccxxkqcvou.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_HbBlyHbGCY6SFmoo9qL1eg_p6jOYVEO' }}
      - name: Install Chromium for browser render smoke test
        run: npm install --no-save --package-lock=false playwright && npx playwright install --only-shell chromium
      - name: Install FFmpeg for media fixtures
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Generate tiny media fixtures for real MP4 export
        run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "color=c=0x553b86:s=320x180:r=30:d=3" -an -c:v libvpx -deadline realtime -cpu-used 8 -pix_fmt yuv420p /tmp/novex-smoke-reference.webm
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "color=c=0x246779:s=320x180:r=30:d=3" -an -c:v libvpx -deadline realtime -cpu-used 8 -pix_fmt yuv420p /tmp/novex-smoke-reference-2.webm
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=3" -c:a pcm_s16le /tmp/novex-smoke-track.wav
      - name: Prepare base-path preview tree
        run: mkdir -p /tmp/novex-preview/NOVEX && cp -a dist/. /tmp/novex-preview/NOVEX/
      - name: Run browser render smoke test
        run: node scripts/browser-render-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: NOVEX-Web-Build
          path: novex-app/dist/
          retention-days: 30
      - uses: actions/upload-pages-artifact@v3
        with:
          path: novex-app/dist/
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Publish Web site (GitHub Pages)
    needs: web
    runs-on: ubuntu-latest
    concurrency:
      group: novex-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: novex-app
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          tools: platform-tools
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: node --check src/main.js && node --check src/motion3d.js && node --check src/cloud.js
      - name: Test render pipeline contracts
        run: npm test
      - run: npm run build && test -s dist/ffmpeg/ffmpeg-core.js && test -s dist/ffmpeg/ffmpeg-core.wasm
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://jtkpydprgqccxxkqcvou.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_HbBlyHbGCY6SFmoo9qL1eg_p6jOYVEO' }}
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: novex-app/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Verify APK archive before upload
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk && test "$(stat -c%s android/app/build/outputs/apk/debug/app-debug.apk)" -gt 1000000 && unzip -t android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NOVEX-Android-APK
          path: novex-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  android-smoke:
    name: Install and launch Android app in emulator
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download APK from this build
        uses: actions/download-artifact@v4
        with:
          name: NOVEX-Android-APK
          path: artifacts
      - name: Boot emulator and smoke-test NOVEX
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb logcat -c
            adb install artifacts/app-debug.apk
            adb shell monkey -p studio.novex.motion 1
            sleep 15
            adb shell pidof studio.novex.motion
            adb shell dumpsys activity activities | grep -F 'studio.novex.motion'
            if adb logcat -d -s AndroidRuntime:E | grep -E 'FATAL EXCEPTION|Unable to load app'; then
              echo 'Android runtime smoke test detected a fatal app error.'
              exit 1
            fi
