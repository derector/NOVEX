name: NOVEX Build
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: novex-build-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: write
  pages: write
  id-token: write
jobs:
  web:
    name: Build installable web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: novex-app
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: node --check src/main.js && node --check src/motion3d.js && node --check src/cloud.js
      - name: Test render pipeline contracts
        run: npm test
      - name: Build for GitHub Pages
        run: npm run build && test -s dist/ffmpeg/ffmpeg-core.js && test -s dist/ffmpeg/ffmpeg-core.wasm
        env:
          VITE_BASE_PATH: /NOVEX/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://jtkpydprgqccxxkqcvou.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_HbBlyHbGCY6SFmoo9qL1eg_p6jOYVEO' }}
      - uses: actions/upload-artifact@v4
        with:
          name: NOVEX-Web-Build
          path: novex-app/dist/
          retention-days: 30
      - uses: actions/upload-pages-artifact@v3
        with:
          path: novex-app/dist/
  deploy:
    name: Publish Web site (GitHub Pages)
    needs: web
    runs-on: ubuntu-latest
    concurrency:
      group: novex-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: novex-app
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          tools: platform-tools
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: node --check src/main.js && node --check src/motion3d.js && node --check src/cloud.js
      - name: Test render pipeline contracts
        run: npm test
      - run: npm run build && test -s dist/ffmpeg/ffmpeg-core.js && test -s dist/ffmpeg/ffmpeg-core.wasm
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://jtkpydprgqccxxkqcvou.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_HbBlyHbGCY6SFmoo9qL1eg_p6jOYVEO' }}
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: novex-app/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NOVEX-Android-APK
          path: novex-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
