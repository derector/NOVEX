name: Motion Engine Agent
on:
  workflow_dispatch:
    inputs:
      task:
        description: "What should the NOVEX coding agent implement?"
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: motion-agent-${{ github.ref }}
  cancel-in-progress: false
jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        working-directory: novex-app
        run: npm install --no-audit --no-fund
      - name: Download approved motion and design references from GitHub
        working-directory: novex-app
        run: npm run skills:sync
      - name: Generate a bounded code patch
        working-directory: novex-app
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOVEX_AGENT_MODEL: ${{ vars.NOVEX_AGENT_MODEL || 'gpt-4.1' }}
          NOVEX_AGENT_TASK: ${{ inputs.task }}
        run: npm run motion:agent
      - name: Validate generated patch
        working-directory: novex-app
        run: node --check src/main.js && node --check src/motion-engine.js && npm test && npm run build
      - name: Open reviewable pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/motion-agent-${{ github.run_id }}
          delete-branch: true
          title: "NOVEX Motion Agent: ${{ inputs.task }}"
          commit-message: "feat: apply validated NOVEX motion agent patch"
          body: |
            Generated by the NOVEX Motion Engine Agent workflow.
            - Downloads allowlisted public skill references into a temporary cache.
            - Writes only approved project paths.
            - Runs syntax checks, contract tests, and a production build.
            - Does not auto-merge; review the diff and CI evidence first.
